<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探索首页预览 A · 标本编辑 + 单色图解</title>
<link rel="stylesheet" href="preview-shared.css">
<style>
/* 方向 A：标本编辑（主）+ 单色图解（辅） */
.specimen{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:28px 26px;position:relative;overflow:hidden}
.specimen::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--accent)}
.spec-kicker{font-size:11px;letter-spacing:3px;color:var(--muted);
  text-transform:uppercase;display:flex;align-items:center;gap:10px}
.spec-kicker::after{content:"";flex:1;height:1px;background:var(--line)}
.specimen h1{font-size:28px;font-weight:600;letter-spacing:2px;margin:10px 0 4px}
.spec-sub{font-size:13px;color:var(--muted);line-height:1.7;max-width:56ch}
.spec-rule{border:none;border-top:1px solid var(--line);margin:16px 0}
/* 单色图解装饰：右上角几何轨道 + 网点，纯装饰不承载数据 */
.diagram{position:absolute;top:14px;right:14px;width:72px;height:72px;opacity:.35;
  pointer-events:none}
/* 标本签输入 */
.spec-label{background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:16px 14px 12px;position:relative;margin-top:4px}
.spec-no{position:absolute;top:-9px;left:12px;font-size:10px;letter-spacing:1px;
  background:var(--accent);color:#fff;padding:1px 9px;border-radius:10px}
.spec-label textarea{width:100%;background:transparent;border:none;font-size:15px;
  min-height:56px;padding:2px 0;outline:none;font-family:inherit;resize:vertical;
  background-image:repeating-linear-gradient(transparent 0 27px, var(--line) 27px 28px);
  line-height:28px}
/* 标本卡（纵向列表） */
.spec-list{display:flex;flex-direction:column;gap:10px}
.spec-card{background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;position:relative}
.spec-card .no{font-size:10px;color:var(--muted);letter-spacing:1.5px}
.spec-card .nm{font-size:16px;font-weight:600;margin:3px 0}
.spec-card .why{font-size:13px;color:var(--muted);line-height:1.55}
.spec-card .rule{border-top:1px solid var(--line);margin:10px 0 8px}
.spec-card .row{display:flex;gap:8px;align-items:center}
@media(max-width:520px){.specimen{padding:22px 16px}.specimen h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="preview-tag">预览 · 方向 A <b>标本编辑 + 单色图解</b></div>
  <div class="notice">这是<b>纯预览</b>，按钮不接真实业务；示例方向为占位数据。状态用下面按钮切换。</div>

  <div class="states">
    <button class="on" data-s="result">结果</button>
    <button data-s="empty">空</button>
    <button data-s="loading">加载</button>
    <button data-s="error">错误</button>
  </div>

  <div class="specimen">
    <svg class="diagram" viewBox="0 0 72 72" fill="none" aria-hidden="true">
      <circle cx="36" cy="36" r="30" stroke="#2b2722" stroke-width="1"/>
      <circle cx="36" cy="36" r="18" stroke="#2b2722" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="36" cy="36" r="3" fill="#853c1e"/>
      <path d="M36 36 L60 12" stroke="#2b2722" stroke-width="1"/>
      <circle cx="60" cy="12" r="2.5" fill="#853c1e"/>
    </svg>

    <div class="spec-kicker">EXPLORATION · 标本 001</div>
    <h1>探索空间</h1>
    <div class="spec-sub">别急着定目标。写下你的模糊感受，Agent 帮你转成「可以试一试的方向」——所有推断都是可编辑的假设，不是定论。</div>
    <hr class="spec-rule">

    <div class="spec-label">
      <span class="spec-no">标本 · 输入</span>
      <textarea placeholder="例：最近很迷茫，不知道该把时间花在什么上"></textarea>
    </div>
    <div style="margin-top:10px"><button class="act primary">探索方向（预览）</button></div>

    <div style="margin-top:16px">
      <div class="state show" data-panel="result">
        <div class="spec-list">
          <div class="spec-card"><div class="no">方向 01</div><div class="nm">把手机留在客厅</div>
            <div class="why">不是睡不着，是没人催就不想下线。</div>
            <div class="rule"></div>
            <div class="row"><span style="font-size:11px;color:var(--ok)">成本·低</span><button class="act narrow">🎭 带去练习（预览）</button></div></div>
          <div class="spec-card"><div class="no">方向 02</div><div class="nm">睡前 30 分钟调暗灯光</div>
            <div class="why">用环境信号把「该睡了」变得可感知。</div>
            <div class="rule"></div>
            <div class="row"><span style="font-size:11px;color:var(--ok)">成本·低</span><button class="act narrow">🎭 带去练习（预览）</button></div></div>
          <div class="spec-card"><div class="no">★ 建议先试</div><div class="nm">今晚把手机留在客厅</div>
            <div class="why">最小动作、今晚就能验证。</div></div>
        </div>
      </div>
      <div class="state" data-panel="empty"><div class="empty-hint">还没有方向。写下感受点「探索方向」。</div></div>
      <div class="state" data-panel="loading"><div class="loading-hint">探索中…</div></div>
      <div class="state" data-panel="error"><div class="error-hint">调用失败，输入已保留，可重试。</div></div>
    </div>
  </div>
</div>
<script>
document.querySelectorAll('.states button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.states button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const s=b.dataset.s;
    document.querySelectorAll('.state').forEach(p=>p.classList.toggle('show',p.dataset.panel===s));
  };
});
</script>
</body>
</html>
